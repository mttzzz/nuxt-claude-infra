name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Node 24 LTS поставляется с npm 11.x — достаточно для OIDC trusted publisher (требует 11.5.1+).
      # Раньше тут был `npm install -g npm@latest`, но self-upgrade ломался MODULE_NOT_FOUND
      # на promise-retry посреди reify (см. failed run 25621554664).

      - run: bun install --frozen-lockfile

      - run: bun run build

      - run: npm publish --provenance --access public

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
