# Base docker-compose template для test-стека.
# Подключается из проектного docker-compose.test.yml через include:
#   include:
#     - path: ./node_modules/@mttzzz/nuxt-claude-infra/templates/docker-compose.test.yml
#
# Подставляемые env-vars (выставляются startTestStackContainers):
#   POSTGRES_PORT, REDIS_PORT, TEST_SERVER_PORT, TEST_DB_NAME, IMAGE_TAG
services:
  postgres-test:
    image: pgvector/pgvector:pg18
    # Pg18 хранит данные в /var/lib/postgresql/<version>/ — mount обязан быть на
    # /var/lib/postgresql, не на ./data, иначе entrypoint падает с
    # "PostgreSQL data in /var/lib/postgresql/data (unused mount/volume)".
    tmpfs: ["/var/lib/postgresql"]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: ${TEST_DB_NAME}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d ${TEST_DB_NAME}"]
      interval: 1s
      timeout: 5s
      retries: 30

  redis-test:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"

  test-server:
    image: ${IMAGE_TAG}
    depends_on:
      postgres-test: { condition: service_healthy }
      redis-test: { condition: service_started }
    environment:
      POSTGRES_URL: postgresql://test:test@postgres-test:5432/${TEST_DB_NAME}
      # Nuxt runtimeConfig читает NUXT_*-prefixed env-vars. Без префикса server
      # не находит Redis (host=127.0.0.1 default → ECONNREFUSED).
      NUXT_REDIS_HOST: redis-test
      NUXT_REDIS_PORT: 6379
      NUXT_REDIS_PASSWORD: ""
      NODE_ENV: test
      SENTRY_DISABLED: 1
      NUXT_TEST_MODE: 1
      PORT: 3000
      NO_COLOR: 1
      CI: 1
    ports:
      - "${TEST_SERVER_PORT}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health/ready || exit 1"]
      interval: 1s
      timeout: 5s
      retries: 60
